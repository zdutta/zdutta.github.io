- slug:   alchemy
  title:  "Alchemy"
  author: "Rory Sutherland"
  year:   2026
  note:   "Sutherland on why logic gets over-trusted because it is easy to defend, and psychology gets under-used because it is not. Perceived value is real value, and optimizing only the measurable parts leaves most of the opportunity untouched."

- slug:   turn-the-ship-around
  title:  "Turn the Ship Around!"
  author: "L. David Marquet"
  year:   2025
  note:   "Marquet takes command of the worst-performing submarine in the fleet and stops giving orders, moving authority to where the information already is. The \"I intend to...\" mechanism turns followers into decision makers."

- slug:   no-rules-rules
  title:  "No Rules Rules"
  author: "Reed Hastings and Erin Meyer"
  year:   2025
  note:   "Hastings and Meyer on the Netflix culture: build talent density, make candor normal, and only then remove the controls. The sequencing matters more than the headline policies."

